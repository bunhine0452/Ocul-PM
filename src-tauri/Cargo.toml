[package]
name = "ocul-pm"
version = "1.16.0"
description = "Ocul-PM — local-first AI project manager for external coding agents"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ocul_pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
sqlite-vec = "0.1.9"
thiserror = "2.0.18"
tracing = "0.1.44"
directories = "6.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream", "http2"] }
async-trait = "0.1.89"
futures = "0.3.32"
fastembed = "5.13.4"
ignore = "0.4.25"
walkdir = "2.5.0"
blake3 = "1.8.5"
regex = "1.11"
# 문서(docs) 뷰어 — docs/ 이미지를 data URI 로 프런트에 전달할 때 사용.
base64 = "0.22"
# PR6.6 — unified-diff generator for LocalDiffView's snapshot fallback path.
# MIT/Apache-2.0. Compact (~70KB compiled). Used only by commands::diff for
# the non-git / HEAD-less branch; the git path still shells out to `git diff`.
similar = "2.6"
tauri-plugin-dialog = "2.7.1"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
portable-pty = "0.8"
tauri-plugin-window-state = "2"
# Self-update (benchmarked from uvws): official updater + process(relaunch).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# .oculpm/ subsystem (W1-PR1)
notify = "6.1"
notify-debouncer-full = "0.3"
serde_yaml = "0.9"
pulldown-cmark = { version = "0.10", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Test-only helpers for the .oculpm/ subsystem (W1-PR4 onwards).
tempfile = "3.10"
tokio = { version = "1.52.3", features = ["test-util"] }






