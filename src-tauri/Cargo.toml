[package]
name = "ocul-pm"
version = "2.39.0"
description = "Ocul-PM — local-first AI project manager for external coding agents"
authors = ["you"]
edition = "2021"
# PR-CI2 가 두 번째 바이너리(oculpm-mcp)를 추가해 `cargo run`(tauri dev 가
# 실행)이 모호해졌다 — 앱 바이너리를 기본 실행 대상으로 고정.
default-run = "ocul-pm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ocul_pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# PR-CI2 (docs/claude-integration D3) — stdio MCP 서버. 앱과 같은 lib 를 링크해
# `.oculpm/` 규격 구현을 공유한다. 디스크 SSOT — 앱 프로세스와 IPC 없음.
[[bin]]
name = "oculpm-mcp"
path = "src/bin/oculpm_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
sqlite-vec = "0.1.9"
thiserror = "2.0.18"
tracing = "0.1.44"
directories = "6.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "process", "net", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream", "http2"] }
async-trait = "0.1.89"
futures = "0.3.32"
fastembed = "5.13.4"
ignore = "0.4.25"
walkdir = "2.5.0"
blake3 = "1.8.5"
regex = "1.11"
# 문서(docs) 뷰어 — docs/ 이미지를 data URI 로 프런트에 전달할 때 사용.
base64 = "0.22"
# PR6.6 — unified-diff generator for LocalDiffView's snapshot fallback path.
# MIT/Apache-2.0. Compact (~70KB compiled). Used only by commands::diff for
# the non-git / HEAD-less branch; the git path still shells out to `git diff`.
similar = "2.6"
tauri-plugin-dialog = "2.7.1"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
portable-pty = "0.8"
# pty-host 의 Kill — 셸·포그라운드 프로세스 그룹에 SIGHUP/SIGKILL 을 직접 보낸다
# (master 닫기만으로는 reader dup 이 살아 있어 아무 신호도 안 갔다).
libc = "0.2"
tauri-plugin-window-state = "2"
# Self-update (benchmarked from uvws): official updater + process(relaunch).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

# .oculpm/ subsystem (W1-PR1)
notify = "6.1"
notify-debouncer-full = "0.3"
serde_yaml = "0.9"
pulldown-cmark = { version = "0.10", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
toml = "0.8"
toml_edit = "0.20"
uuid = { version = "1", features = ["v4"] }

# PR-ACP0 — ACP(Agent Client Protocol) 클라이언트. 어댑터 서브프로세스 spawn 과
# JSON-RPC 트랜스포트를 크레이트가 함께 담당한다 (`AcpAgent` 가 ConnectTo 구현).
# 설계 SSOT: docs/acp-panel/00-master-plan.md
agent-client-protocol = "2"
# 코드 화면의 파일 삭제 — 영구 삭제 대신 OS 휴지통으로 보낸다. IDE 안에서
# 되돌릴 수 없는 삭제는 만들지 않는다 (폴더 삭제는 재귀라 더더욱).
# default-features off = chrono 를 끌어오는 휴지통 메타데이터 기능 제외.
trash = { version = "5.2.6", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", features = ["fs"] }
if-addrs = "0.13"
tower = { version = "0.5", features = ["util"] }
cron = "0.17.0"
# 플러그인 번들 임포트 (Phase 6 #import-guards) — ZIP64 포함. deflate 만 켠다
# (bzip2·zstd 는 Claude 플러그인 번들에 쓰이지 않는다).
zip = { version = "5", default-features = false, features = ["deflate"] }
tauri-plugin-deep-link = "2.4.10"

# ⌘V 로 Finder 가 복사한 파일을 받기 위한 최소 표면 — OS pasteboard 읽기.
#
# 웹뷰의 paste 이벤트로는 안 된다: 파일 하나는 `File` 로 실려 오지만 **폴더는
# 아무것도 실리지 않고**, 실려 온 바이트를 base64 로 IPC 에 태우면 큰 파일에서
# 그대로 비용이 된다. pasteboard 의 `public.file-url` 을 직접 읽으면 드롭
# (Tauri 가 절대경로를 준다)과 **같은 모양의 경로 목록**이 되어 창구가 하나로 모인다.
# 세 크레이트 모두 이미 tao/wry 를 통해 의존 그래프에 있다 (새 다운로드 없음).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Test-only helpers for the .oculpm/ subsystem (W1-PR4 onwards).
tempfile = "3.10"
tokio = { version = "1.52.3", features = ["test-util"] }

# 빌드 프로파일 (2026-08-11). 이전에는 프로파일 지정이 아예 없어 카고 기본값으로
# 나갔다 — tree-sitter 5종 + fastembed/ort + tauri 를 링크하는 규모에서는 기본값이
# 남기는 것이 많다.
[profile.release]
opt-level = 3
# "fat" 대신 "thin": 링크 시간이 몇 배 차이 나는데 크기/속도 이득은 대부분 따라온다.
lto = "thin"
# 크레이트당 코드생성 단위를 1로 두면 인라이닝 범위가 넓어진다 (빌드는 느려진다).
codegen-units = 1
strip = true

# panic = "abort" 는 일부러 넣지 않는다. 이 앱은 .oculpm 잠금을 Drop 으로 푼다
# (oculpm/lock.rs 의 LockGuard). abort 는 되감기를 건너뛰어 소멸자를 돌리지 않으므로,
# 패닉 한 번에 잠금 파일이 남아 다음 실행이 "다른 프로세스가 쓰는 중"으로 막힌다.
# 바이너리 몇 %를 그 위험과 바꾸지 않는다.

[profile.dev]
# 기본값(debug = true)은 macOS 에서 split-debuginfo="unpacked" 와 맞물려
# target/debug 를 수십 GB 로 불린다 (실측 24GB, deps 에만 파일 50,619개).
# line-tables-only 는 백트레이스의 파일·줄 번호를 그대로 남기면서 타입/변수
# 디버그 정보만 뺀다 — 디버거로 변수를 들여다볼 때만 debug = true 로 되돌리면 된다.
debug = "line-tables-only"

# 의존성은 최적화해서 컴파일한다. 우리 코드만 -O0 으로 남으므로 증분 빌드 속도는
# 유지되면서, 디버그 실행 시 fastembed/ort 임베딩과 tree-sitter 파싱이 몇 배 빨라진다.
# 최초 1회 의존성 재컴파일 비용이 든다.
[profile.dev.package."*"]
opt-level = 2





