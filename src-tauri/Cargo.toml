[package]
name = "ai-pm"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
sqlite-vec = "0.1.9"
thiserror = "2.0.18"
tracing = "0.1.44"
directories = "6.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream", "http2"] }
async-trait = "0.1.89"
futures = "0.3.32"
fastembed = "5.13.4"
ignore = "0.4.25"
walkdir = "2.5.0"
blake3 = "1.8.5"
tauri-plugin-dialog = "2.7.1"

