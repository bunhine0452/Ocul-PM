name: Portability

# 크로스플랫폼 라운드 (플랜 `cross-platform-port` #w0-portability-ci ·
# 설계 docs/20260923_cross-platform/00-master-plan.md D1·D2).
#
# 사용자는 Windows·Linux 를 직접 테스트할 수 없다 — **이 러너들이 실기기다.**
# 그래서 "그 OS 에서 컴파일된다" 가 아니라 "그 OS 에서 테스트가 돌았다" 를 본다.
#
# ci.yml 과 분리한 이유 (D2): release.yml 의 gate 는 태그 커밋에서 **ci.yml** 이
# 초록인지 본다. 처음부터 붉을 이 잡들을 ci.yml 에 넣으면 macOS 릴리스가 막힌다.
# #w0-promote 의 결정(2026-09-25, 아래 트리거 주석): ci.yml 로 합치지 않고 main push 에서도
# 돈다 — 릴리스 게이트는 계속 ci.yml 만 본다.
#
# 각 단계는 continue-on-error 로 끝까지 돌고, 마지막 「요약」 단계가 결과를 모아
# 붉힌다. 첫 실행의 목적이 **오류 전수(인벤토리)** 라서다 — check 가 깨졌다고
# test 컴파일 오류를 못 보면 인벤토리가 반쪽이 된다. 로그는 아티팩트로 남는다.

# 트리거 (#w0-promote, 2026-09-25 결정):
#   - main push 에서도 돈다 — 태그를 밀기 전에 그 커밋이 Windows·Linux 에서 초록인지 보는
#     창이다(docs/RELEASE.md §0). 문서·일지만 바뀐 push(.oculpm · docs · landing · 루트 *.md)는
#     건너뛴다 — main 에 가장 잦은 push 가 일지 커밋이다.
#   - ci.yml 로 합치지 **않는다**(D2). release.yml 의 gate 는 ci.yml 만 보므로 이 잡들이 붉어도
#     macOS 릴리스는 막히지 않는다. Windows·Linux 를 릴리스에 싣느냐는 release.yml 이 태그
#     커밋에서 번들·설치 스모크·설치본 E2E 를 다시 돌려 정한다(D7) — 여기의 초록은 미리보기다.
#   - required(브랜치 보호)로도 올리지 않는다 — main 은 보호 규칙이 없고, Windows 한 바퀴가
#     40분을 넘어 머지 대기를 macOS CI(10분)의 네 배로 늘린다.
#   - pull_request 는 아직 넣지 않았다: port/** 브랜치의 PR 은 push 와 PR 이벤트로 두 번 돌고
#     (concurrency 그룹이 ref 로 갈린다), 아래 사이드카·번들 판정 잡은 PR 이벤트에
#     github.event.before 가 없어 「첫 push」 로 읽어 PR 마다 릴리스 프로필 빌드를 두 벌 돈다.
#     판정 잡이 PR 이면 base sha 와 비교하게 된 뒤에 넣는다.
on:
  push:
    branches:
      - main
      - 'port/**'
    paths-ignore:
      - '.oculpm/**'
      - 'docs/**'
      - 'landing/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: 릴리스 빌드와 같은 glibc 하한 (D10).
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Windows 콜드 빌드는 macOS(10분 31초)보다 훨씬 길다. 매달림만 끊는다.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: 툴체인 버전 읽기 (rust-toolchain.toml)
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | tr -d ' "\r' | cut -d= -f2)
          if [ -z "$channel" ]; then
            echo "::error file=rust-toolchain.toml::channel 을 못 읽었습니다."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rust-analyzer, rustfmt, clippy

      # Tauri 2 의 Linux 전제 + keyring(sync-secret-service)의 libdbus.
      - name: Linux 시스템 의존성
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev build-essential pkg-config file patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: cargo check --all-targets
        id: check
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo check --all-targets --locked --message-format=short 2>&1 | tee ../check.log

      - name: cargo clippy -D warnings
        id: clippy
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee ../clippy.log

      # check·clippy 로그를 테스트 **전에** 먼저 올린다. 테스트 단계(윈도우 10분+)가
      # 끝나기를 기다리지 않고 컴파일 오류를 받아 다음 수정을 시작하려고 — 잡이 끝나야
      # 로그를 볼 수 있어서 W1 반복마다 그만큼을 기다렸다.
      - name: 빌드 로그 아티팩트 (check·clippy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-rust-build-${{ matrix.os }}
          path: |
            check.log
            clippy.log
          if-no-files-found: ignore

      # 컴파일이 되는 만큼만 돈다. 실패 테스트 목록이 인벤토리의 절반이다.
      # 단계 시한: Windows 에서 테스트가 매달리면(PTY·소켓 대기) 잡 시한에 걸려
      # 로그 아티팩트까지 잃는다. 단계만 끊고 다음으로 넘어간다.
      - name: cargo test --no-fail-fast
        id: test
        continue-on-error: true
        timeout-minutes: 60
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee ../test.log

      - name: 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-rust-${{ matrix.os }}
          path: |
            check.log
            clippy.log
            test.log
          if-no-files-found: ignore

      - name: 요약
        if: always()
        run: |
          count() { if [ -f "$1" ]; then grep -cE "$2" "$1" || true; else echo 0; fi; }
          {
            echo "## ${{ matrix.os }}"
            echo ""
            echo "| 단계 | 결과 | 줄 수 |"
            echo "|---|---|---|"
            echo "| cargo check | ${{ steps.check.outcome }} | error $(count check.log '^(error|.*: error)') |"
            echo "| cargo clippy | ${{ steps.clippy.outcome }} | error $(count clippy.log '^(error|.*: error)') |"
            echo "| cargo test | ${{ steps.test.outcome }} | FAILED $(count test.log ' FAILED$') |"
            echo ""
            echo "실패 테스트:"
            echo '```'
            grep -E '^    [a-zA-Z0-9_:]+$' test.log 2>/dev/null | sort -u | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outcome }}" != "success" ] || \
             [ "${{ steps.clippy.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::error::이식성 실패 — 요약과 아티팩트 로그를 볼 것"
            exit 1
          fi

  # ubuntu 의 프런트 게이트는 ci.yml 이 이미 돈다. 여기선 Windows 만 — 경로 구분자·
  # CRLF·셸 차이가 vitest 와 빌드 스크립트(check-critical-css 등)에 걸리는지 본다.
  # `pnpm build` 는 tauri 의 beforeBuildCommand 라 Windows 번들의 전제다.
  frontend-windows:
    name: 프런트 — windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Test (vitest)
        id: vitest
        continue-on-error: true
        run: pnpm test

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## frontend — windows-latest"
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| vitest | ${{ steps.vitest.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || \
             [ "${{ steps.vitest.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::Windows 프런트 실패 — 각 단계 로그를 볼 것"
            exit 1
          fi

  # ── 사이드카 (크로스플랫폼 L-INTEG #integ-build-sidecar) ──────────────────────
  # `scripts/build-sidecar.mjs` 가 그 OS 에서 `binaries/oculpm-mcp-<triple>[.exe]` 를
  # **실제로 만드는지**, 만든 것이 실행되는지 본다. tauri 번들(W3)의 전제다. 릴리스
  # 프로필(thin LTO · codegen-units=1)이라 한 OS 에 수십 분 걸려서, 사이드카에 닿는
  # 파일이 바뀐 push 에서만 돈다. 외부 액션(paths-filter 등) 없이 `git diff` 로 판정 —
  # job 수준 `if:` 는 식만 평가하므로 판정을 작은 잡 하나로 떼어 출력으로 넘긴다.
  sidecar-changes:
    name: 사이드카 — 바뀐 파일 판정
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 판정
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          run=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=true; why="수동 실행"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            run=true; why="브랜치 첫 push"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # 강제 push(rebase) 뒤에는 이전 머리가 이 클론에 없다 — 모르면 돈다.
            run=true; why="이전 머리 $BEFORE 를 못 찾음 (강제 push)"
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER" | grep -E '^(scripts/build-sidecar\.mjs|plugin/|\.claude-plugin/|src-tauri/src/bin/|src-tauri/build\.rs|\.github/workflows/portability\.yml)' || true)
            if [ -n "$changed" ]; then
              run=true; why=$(echo $changed)
            else
              why="사이드카에 닿는 변경 없음"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "사이드카 잡: run=$run — $why" | tee -a "$GITHUB_STEP_SUMMARY"

  sidecar:
    name: 사이드카 — ${{ matrix.os }}
    needs: sidecar-changes
    if: needs.sidecar-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: 툴체인 버전 읽기 (rust-toolchain.toml)
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | tr -d ' "\r' | cut -d= -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Linux 시스템 의존성
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev build-essential pkg-config

      - name: Rust cache (release)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: sidecar-release
          cache-on-failure: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: node scripts/build-sidecar.mjs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/build-sidecar.mjs 2>&1 | tee sidecar.log

      # 이름은 tauri externalBin 이 찾는 `oculpm-mcp-<호스트 triple>[.exe]` 이어야 하고,
      # 0바이트 자리표시자(build.rs)가 아니라 **실행되는** 바이너리여야 한다. 스크립트는
      # 플러그인·마켓플레이스 버전만 스탬프하므로, 이미 맞춰 둔 파일은 바뀌면 안 된다.
      - name: 산출물 — 이름 · 크기 · 실행 · 버전 파일 불변
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="src-tauri/binaries/oculpm-mcp-${triple}${ext}"
          ls -la src-tauri/binaries/ | tee -a sidecar.log
          test -s "$out"
          size=$(wc -c < "$out" | tr -d ' ')
          echo "size=$size" | tee -a sidecar.log
          [ "$size" -gt 1048576 ]
          ver=$("$out" --version 2>&1)
          echo "$ver" | tee -a sidecar.log
          case "$ver" in "oculpm-mcp "*) ;; *) echo "::error::--version 응답이 이상하다: $ver"; exit 1 ;; esac
          git diff --exit-code -- plugin .claude-plugin

      - name: 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-sidecar-${{ matrix.os }}
          path: sidecar.log
          if-no-files-found: ignore

      - name: 요약
        if: always()
        run: |
          {
            echo "## sidecar — ${{ matrix.os }}"
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| build-sidecar.mjs | ${{ steps.build.outcome }} |"
            echo "| 산출물 검증 | ${{ steps.verify.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "::error::사이드카 빌드 실패 — 요약과 sidecar.log 를 볼 것"
            exit 1
          fi

  # ── 설치 파일 · 설치 스모크 (크로스플랫폼 W3 L-PKG #w3-conf #w3-bundles #w3-install-smoke) ──
  # 릴리스와 **같은 설정**으로 설치 파일을 만든다. macOS 가 쓰는 tauri.conf.json 은 그대로
  # 두고(D3), Tauri 가 스스로 병합하는 플랫폼 파일(JSON Merge Patch — tauri-utils
  # config/parse.rs `read_from`)을 얹는다. macOS 빌드는 tauri.macos.conf.json 만 찾으므로
  # 아래 두 파일을 읽지 않는다. 두 파일이 그 모양인 이유 (JSON 이라 주석을 못 단다):
  #   tauri.windows.conf.json — NSIS 하나(targets "all" 이면 MSI 까지 만든다) · installMode
  #     currentUser(관리자 권한 없이 %LOCALAPPDATA%\Ocul-PM, 업데이터가 UAC 없이 덮는다) ·
  #     WebView2 embedBootstrapper(+1.8MB — 부트스트래퍼를 받으러 나가지 않는다. 런타임 설치는
  #     여전히 인터넷이 필요하다: 완전 오프라인은 offlineInstaller +127MB) · 설치 언어
  #     English·Korean(OS 언어를 따르고, 목록에 없는 언어면 첫 항목 English 로) ·
  #     installerHooks src-tauri/windows/installer-hooks.nsh — ① Windows 10 2004(19041) 미만은
  #     막고 안내(DirectML!DMLCreateDevice1) ② VC++ 재배포를 없거나 낡았을 때만 설치(실패면
  #     멈추고 안내) ③ Claude Code·Codex 가 띄워 둔 oculpm-mcp.exe 가 파일을 잠가 재설치·
  #     업데이트가 옛 사이드카를 남기거나(/S) 대화상자에 멈추던(/P) 것을 먼저 비켜 두어 푼다.
  #   tauri.linux.conf.json — AppImage + deb (D10, rpm 은 보류). deb Depends 의
  #     libwebkit2gtk-4.1-0 · libgtk-3-0 · libayatana-appindicator3-1 은 tauri-cli 가 스스로
  #     넣는다(tray-icon 기능을 보고 — tauri-cli interface/rust.rs). 여기 또 적으면 두 번
  #     들어간다. 실행 파일이 직접 링크하는 것만 더한다: libssl3(native-tls ← fastembed
  #     hf-hub) — t64 전환 뒤 이름 libssl3t64 도 받는다 — 와 libdbus-1-3(keyring secret-service).
  #     .desktop 은 src-tauri/linux/ocul-pm.desktop 템플릿으로 굽는다 — 번들러 기본 템플릿은
  #     `Exec=ocul-pm` 에 %u 가 없다 — GLib(gio)는 필드 코드가 없으면 %f 로 치고
  #     (gdesktopappinfo.c "If there is no macro default to %f"), oculpm:// 는 로컬 경로가
  #     없어 인자에서 빠진다: 앱은 뜨지만 링크를 못 받는다. category DeveloperTool →
  #     Categories=Development; (기본은 빈 칸).
  #
  # 느리다(릴리스 프로필 · thin LTO · codegen-units=1, 사이드카와 앱 두 번 링크) — 번들에
  # 닿는 파일이 바뀐 push 와 수동 실행에서만 돈다(판정은 사이드카 잡과 같은 방식).
  # 스모크 스크립트만 바뀐 push 는 번들을 다시 굽지 않고 이 브랜치의 앞 run 번들을 쓴다.
  bundle-changes:
    name: 번들 — 바뀐 파일 판정
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      bundle: ${{ steps.gate.outputs.bundle }}
      smoke: ${{ steps.gate.outputs.smoke }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # 번들(수십 분)을 기다리기 전에 스모크 스크립트의 문법부터 — 오타 하나로 한 바퀴를
      # 버리지 않는다. 우분투 러너에 pwsh·shellcheck 가 기본으로 있다.
      - name: 스모크 스크립트 문법 (pwsh 파서 · bash -n · shellcheck)
        run: |
          pwsh -NoProfile -Command '
            $bad = 0
            foreach ($f in Get-ChildItem ".github/scripts" -Filter "*.ps1") {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
              foreach ($e in @($errs)) { Write-Host "::error file=.github/scripts/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
              Write-Host "$($f.Name): 파서 오류 $(@($errs).Count)"
            }
            if ($bad) { exit 1 }'
          bash -n .github/scripts/install-smoke-linux.sh
          shellcheck -S warning .github/scripts/install-smoke-linux.sh
          echo "install-smoke-linux.sh: bash -n · shellcheck(warning 이상) 통과"
      - name: 판정
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          bundle=false
          smoke=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bundle=true; why="수동 실행"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            bundle=true; why="브랜치 첫 push"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bundle=true; why="이전 머리 $BEFORE 를 못 찾음 (강제 push)"
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            hit=$(grep -E '^(src-tauri/tauri(\.[a-z]+)?\.conf\.json|src-tauri/build\.rs|src-tauri/Cargo\.toml|package\.json|src-tauri/icons/|src-tauri/linux/|src-tauri/windows/|\.github/scripts/fetch-vcredist\.|\.github/workflows/portability\.yml)' <<<"$changed" || true)
            smoke_hit=$(grep -E '^\.github/scripts/install-smoke-' <<<"$changed" || true)
            if [ -n "$hit" ]; then
              bundle=true; why=$(echo $hit)
            elif [ -n "$smoke_hit" ]; then
              smoke=true; why="스모크 스크립트만 ($(echo $smoke_hit)) — 앞 run 의 번들로"
            else
              why="번들에 닿는 변경 없음"
            fi
          fi
          if [ "$bundle" = true ]; then smoke=true; fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "번들 잡: bundle=$bundle smoke=$smoke — $why" | tee -a "$GITHUB_STEP_SUMMARY"

  bundle:
    name: 번들 — ${{ matrix.os }}
    needs: bundle-changes
    if: needs.bundle-changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: 툴체인 버전 읽기 (rust-toolchain.toml)
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | tr -d ' "\r' | cut -d= -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.triple }}

      # Tauri 문서의 Debian 전제 + keyring 의 libdbus. file·patchelf 는 AppImage 번들러가 쓴다.
      - name: Linux 시스템 의존성
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev build-essential pkg-config file patchelf

      - name: Rust cache (release)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: bundle-release
          cache-on-failure: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts: true 는 서명 키가 없으면 번들을 실패시킨다. 릴리스 키
      # (secrets.TAURI_PRIVATE_KEY)는 여기서 쓰지 않는다 — 이 잡에서만 사는 일회용 키를
      # 만들어 설정(tauri.conf.json)을 한 글자도 덮지 않고 릴리스와 같은 경로로 굽는다.
      # 그 덕에 NSIS·AppImage 옆에 업데이터 .sig 가 실제로 생기는지도 본다(W4 전제).
      # 이 키로 서명한 .sig 는 앱에 박힌 공개 키와 안 맞으므로 올리지 않는다.
      # Windows 설치 파일은 Microsoft VC++ 재배포(x64)를 싣는다 — 앱과 사이드카가 MSVCP140 을
      # 가져오는데(사전 빌드 ONNX Runtime) 재배포가 없는 PC 에서는 아예 안 뜬다. 훅
      # (src-tauri/windows/installer-hooks.nsh)이 없거나 낡았을 때만 설치한다. 판 고정 URL ·
      # SHA-256 · Authenticode 를 확인하고 훅이 include 할 정의를 쓴다. release.yml 도 같은 스크립트.
      - name: VC++ 재배포 받기 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/fetch-vcredist.ps1

      - name: 업데이터 서명 키 — 이 잡 전용 일회용
        run: |
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/ci-updater.key" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/ci-updater.key" >> "$GITHUB_ENV"

      # --target 을 호스트 triple 로 준다: beforeBuildCommand 의 build-sidecar.mjs 가
      # `cargo build --release --target <호스트>` 로 사이드카를 구우므로 같은 target 폴더를
      # 써야 의존성을 두 번 컴파일하지 않는다.
      - name: pnpm tauri build --target ${{ matrix.triple }}
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm tauri build --target ${{ matrix.triple }} 2>&1 | tee bundle.log

      # 설정 병합의 실증: tauri.conf.json 은 targets "all" 이다 — Windows 에 msi, Linux 에
      # rpm 이 없으면 플랫폼 파일이 실제로 병합된 것이다.
      - name: 산출물 — 모으기 · 크기 · 업데이터 .sig · 플랫폼 설정 병합
        id: collect
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          b="src-tauri/target/${{ matrix.triple }}/release/bundle"
          echo "번들 폴더: $(ls "$b" | tr '\n' ' ')" | tee bundle-files.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            files=("$b"/nsis/*-setup.exe); want=1; signed=("${files[@]}")
            if [ -d "$b/msi" ]; then echo "::error::msi 가 생겼다 — tauri.windows.conf.json 이 병합되지 않았다"; exit 1; fi
          else
            files=("$b"/appimage/*.AppImage "$b"/deb/*.deb); want=2; signed=("$b"/appimage/*.AppImage)
            if [ -d "$b/rpm" ]; then echo "::error::rpm 이 생겼다 — tauri.linux.conf.json 이 병합되지 않았다"; exit 1; fi
          fi
          if [ "${#files[@]}" -ne "$want" ]; then
            echo "::error::설치 파일이 ${want}개여야 하는데 ${#files[@]}개: ${files[*]:-없음}"
            exit 1
          fi
          mkdir -p dist-bundle
          for f in "${files[@]}"; do
            cp "$f" dist-bundle/
            printf '%s\t%s bytes\n' "$(basename "$f")" "$(wc -c <"$f" | tr -d ' ')" | tee -a bundle-files.txt
          done
          for f in "${signed[@]}"; do
            if [ ! -s "$f.sig" ]; then echo "::error::업데이터 서명 $f.sig 가 없다"; exit 1; fi
            echo "$(basename "$f").sig 있음 (일회용 키 — 올리지 않는다)" | tee -a bundle-files.txt
          done
          echo "commit=${{ github.sha }} run=${{ github.run_id }}" > dist-bundle/bundle-info.txt

      - name: 설치 파일 아티팩트
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: portability-bundle-${{ matrix.os }}
          path: dist-bundle/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: 번들 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-bundle-log-${{ matrix.os }}
          path: |
            bundle.log
            bundle-files.txt
          if-no-files-found: ignore

      - name: 요약
        if: always()
        run: |
          {
            echo "## bundle — ${{ matrix.os }}"
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| pnpm tauri build | ${{ steps.build.outcome }} |"
            echo "| 산출물 · .sig · 설정 병합 | ${{ steps.collect.outcome }} |"
            echo ""
            echo '```'
            cat bundle-files.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "::error::번들 실패 — 요약과 bundle.log 를 볼 것"
            exit 1
          fi

  # 깨끗한 러너(빌드 러너와 다른 기계)에서 설치 → 실행 → 재설치 → 제거. 무엇을 보는지는
  # .github/scripts/install-smoke-{windows.ps1,linux.sh} 머리 주석에 있다. gate 가 하나라도
  # 붉으면 잡이 붉고, 관찰(observe) 항목은 기록만 한다 — 결과표는 잡 요약과 아티팩트
  # summary.md 에.
  install-smoke:
    name: 설치 스모크 — ${{ matrix.os }}
    needs: [bundle-changes, bundle]
    if: ${{ !cancelled() && needs.bundle-changes.outputs.smoke == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Windows 는 servercore 컨테이너 이미지(수 GB)를 받는다.
    timeout-minutes: 60
    # 다른 run 의 아티팩트를 받으려면 actions: read 가 있어야 한다.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: 번들 출처 — 이 run, 번들을 건너뛴 push 면 이 브랜치의 앞 run
        id: src
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: portability-bundle-${{ matrix.os }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          has() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?name=$NAME" \
              --jq '[.artifacts[] | select(.expired | not)] | length'
          }
          if [ "$(has "$RUN_ID")" -gt 0 ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "이 run 의 번들"
            exit 0
          fi
          if [ "$BUNDLE_RESULT" != "skipped" ]; then
            echo "::error::이 run 에서 $NAME 이 만들어지지 않았다 (bundle 잡: $BUNDLE_RESULT)"
            exit 1
          fi
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/portability.yml/runs?branch=$BRANCH&per_page=30" --jq '.workflow_runs[].id'); do
            if [ "$id" != "$RUN_ID" ] && [ "$(has "$id")" -gt 0 ]; then
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              echo "번들을 건너뛴 push — 앞 run $id 의 번들을 쓴다" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::이 브랜치의 최근 run 에 $NAME 이 없다 — workflow_dispatch 로 번들부터 굽는다"
          exit 1

      - name: 설치 파일 받기
        uses: actions/download-artifact@v4
        with:
          name: portability-bundle-${{ matrix.os }}
          path: bundle
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 번들 정보 · 기대 버전
        id: ver
        shell: bash
        run: |
          ls -la bundle
          cat bundle/bundle-info.txt || true
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 설치 스모크 — Windows (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path bundle -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { Write-Host '::error::설치 파일(*-setup.exe)이 없다'; exit 1 }
          $global:LASTEXITCODE = 99
          & ./.github/scripts/install-smoke-windows.ps1 -Installer $installer.FullName -Version '${{ steps.ver.outputs.version }}' -OutDir smoke-out
          exit $LASTEXITCODE

      - name: 설치 스모크 — Linux (AppImage · deb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-smoke-linux.sh bundle '${{ steps.ver.outputs.version }}' smoke-out

      - name: 스모크 결과 아티팩트 (로그 · 스크린샷 · 매니페스트 · summary.md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-install-smoke-${{ matrix.os }}
          path: smoke-out/
          if-no-files-found: ignore
