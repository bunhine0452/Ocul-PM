name: E2E

# 크로스플랫폼 W3 · L-E2E (플랜 `cross-platform-port` #w3-e2e · #w3-ime-cdp,
# 설계 docs/20260923_cross-platform/00-master-plan.md D1·D8).
#
# 실제 앱을 tauri-driver(WebDriver)로 띄워 첫 실행 → 프로젝트 추가 → 15화면 →
# 터미널 한글 왕복 → 사이드카 일지 → 영어 모드까지 돌고, 단계마다 스크린샷을
# 아티팩트(`e2e-windows` · `e2e-linux`)로 남긴다. 사용자는 Windows·Linux 기기가
# 없다 — **그 아티팩트의 index.html 이 그 OS 의 화면을 보는 유일한 창구다.**
#
# macOS 는 대상이 아니다: tauri-driver 는 WKWebView 드라이버가 없어 Windows·Linux 만
# 지원한다. macOS 동작은 ci.yml 이 지킨다.
#
# portability.yml 과 같은 이유(D2)로 port/** push 와 수동 실행에서만 돈다 — 처음부터
# 붉을 수 있는 잡을 PR·main 에 달지 않는다. 승격은 #w0-promote 가 정한다.
on:
  push:
    branches:
      - 'port/**'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: 릴리스 빌드와 같은 glibc·WebKitGTK 하한 (D10).
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Windows 콜드 빌드가 대부분이다. 매달림만 끊는다.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      # run.mjs 의 OS 이름(아티팩트·파일 이름)과 같다. job env 에서는 runner 문맥을
      # 못 쓴다 — matrix 로 가른다.
      OCULPM_E2E_OS: ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
    steps:
      - uses: actions/checkout@v6

      - name: 툴체인 버전 읽기 (rust-toolchain.toml)
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | tr -d ' "\r' | cut -d= -f2)
          if [ -z "$channel" ]; then
            echo "::error file=rust-toolchain.toml::channel 을 못 읽었습니다."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Tauri 2 의 Linux 전제 + WebKitWebDriver(설치된 libwebkit2gtk 와 같은 소스
      # 패키지) · Xvfb · xdotool(창 크기 폴백) · 세션 D-Bus(single-instance·keyring) ·
      # 한글 글꼴(러너에는 CJK 글꼴이 없어 한글이 두부로 찍힌다 — 한국어 사용자의
      # 데스크톱에는 있다).
      - name: Linux 시스템 의존성 (+ WebKitWebDriver · Xvfb · 한글 글꼴)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev build-essential pkg-config \
            webkit2gtk-driver xvfb xdotool dbus fonts-noto-cjk
          command -v WebKitWebDriver

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: e2e-debug
          cache-on-failure: true

      # ~/.cargo/bin 은 rust-cache 가 함께 캐시한다 — 같은 버전이면 설치를 건너뛴다.
      - name: tauri-driver
        run: cargo install tauri-driver --locked --version 2.0.6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: msedgedriver (WebView2 런타임 버전에 맞춤)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/ci/msedgedriver.ps1

      # 기본 1024×768 이면 1440 폭 창을 OS 가 화면 크기로 자른다.
      - name: 화면 해상도 1920×1080
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List

      # 사이드카는 tauri externalBin 규약대로 binaries/ 에 둔다 — tauri-build 가 앱
      # 옆(target/debug/oculpm-mcp)으로 옮긴다. 비워 두면 0바이트 자리표시자가 간다.
      - name: 사이드카 (debug)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo build --locked --bin oculpm-mcp
          triple=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p binaries
          cp "target/debug/oculpm-mcp${ext}" "binaries/oculpm-mcp-${triple}${ext}"
          ls -la binaries

      # 앱은 번들 없이 빌드한 **디버그** 실행 파일로 띄운다(프런트는 내장 — devUrl
      # 아님). 릴리스 프로필(thin LTO·codegen-units=1)은 Windows 콜드 빌드가 한
      # 시간을 넘는데, E2E 가 보려는 것(화면·IPC·PTY·사이드카)은 프로필과 무관하다.
      # 릴리스 링크·설치 파일은 L-PKG(#w3-bundles)와 설치 스모크(#w3-install-smoke)
      # 몫이고, 이 하네스는 `--app <설치된 실행 파일>` 로 그대로 붙는다.
      # beforeBuildCommand 는 `pnpm build` 로 바꾼다 — 기본값은 릴리스 사이드카까지
      # 빌드한다(위에서 디버그로 준비했다). 번들·업데이터 서명은 하지 않는다.
      - name: 앱 빌드 (debug · 번들 없음)
        run: pnpm tauri build --debug --no-bundle --config e2e/tauri.e2e.conf.json

      - name: E2E
        id: e2e
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1200x24" node e2e/run.mjs
          else
            node e2e/run.mjs
          fi

      - name: 남은 프로세스 정리 (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Stop-Process -Name ocul-pm, msedgedriver, tauri-driver -Force -ErrorAction SilentlyContinue

      - name: 남은 프로세스 정리 (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          pkill -f 'target/debug/ocul-pm' || true
          pkill -f WebKitWebDriver || true
          pkill -f tauri-driver || true

      - name: 아티팩트 (스크린샷 · index.html · 로그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ env.OCULPM_E2E_OS }}
          path: e2e/out/
          if-no-files-found: warn

      - name: 요약
        if: always()
        run: |
          summary="e2e/out/${OCULPM_E2E_OS}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## E2E — ${OCULPM_E2E_OS}: 요약 없음 (E2E 단계 로그를 볼 것)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.e2e.outcome }}" != "success" ]; then
            echo "::error::E2E 실패 — 아티팩트 e2e-${OCULPM_E2E_OS} 의 index.html 을 볼 것"
            exit 1
          fi
