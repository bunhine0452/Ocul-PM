name: CI

# 태그 빌드(release.yml)와 역할이 다릅니다 — 이쪽은 **머지 전 게이트**입니다.
# release.yml 은 `v*` 태그에서 번들만 굽고 테스트를 돌리지 않으므로, 여기서
# typecheck · test · lint · build · cargo test 를 강제합니다.
#
# 잡을 셋으로 나눈 이유: 프런트 게이트는 Rust 툴체인이 필요 없어 ubuntu 에서
# 1~2분에 끝나고, Rust 잡만 macOS 를 씁니다(아래 사유). cargo-deny 잡은 Cargo.lock
# 만 읽어 툴체인 없이 ubuntu 에서 돕니다. 셋은 병렬로 돕니다.

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연속 푸시하면 앞선 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 프런트 — typecheck · test · lint · build
    runs-on: ubuntu-latest
    # 매달린 잡이 러너를 붙잡지 않게 — 정상 실행은 2분 안팎이다.
    timeout-minutes: 20
    steps:
      # `lint:filesize` 래칫이 직전 커밋(`HEAD^1`)의 파일을 꺼내 봅니다 —
      # 기본 depth 1 로는 그 커밋이 없어 게이트가 스택트레이스로 죽습니다.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # pnpm 을 setup-node 보다 **먼저** 깔아야 `cache: pnpm` 이 스토어를 찾습니다.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      # 게이트 6종: storage(localStorage 직접 접근 금지) · i18n(하드코딩 한국어) ·
      # bindings · design · filesize 래칫 · ESLint(react-hooks 중심, 경고 상한 래칫).
      - name: Lint (storage · i18n · bindings · design · filesize · eslint)
        run: pnpm lint

      # tsc && vite build && check-critical-css. dist 는 산출물만 확인하고 버립니다.
      - name: Build
        run: pnpm build

  rust:
    name: Rust — cargo test · bindings 신선도
    # macos 고정: tauri 의 `macos-private-api` feature 와 cfg(target_os = "macos")
    # 코드 경로가 있어 ubuntu 빌드는 미검증입니다. 저장소가 public 이라
    # macOS 러너 분과금은 없습니다.
    runs-on: macos-latest
    # 콜드 빌드 실측 10분31초 — 그 세 배를 넘기면 매달린 것이다.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # 버전의 주인은 `rust-toolchain.toml` 입니다 (#toolchain-pin). dtolnay 액션은
      # 그 파일을 **읽지 않으므로** 여기서 꺼내 넘깁니다 — `@stable` 로 두면 핀을
      # 박아 놓고도 CI 는 그날의 stable 을 씁니다(= 핀이 없는 것과 같습니다).
      - name: 툴체인 버전 읽기 (rust-toolchain.toml)
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | tr -d ' "' | cut -d= -f2)
          if [ -z "$channel" ]; then
            echo "::error file=rust-toolchain.toml::channel 을 못 읽었습니다."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "핀된 툴체인: $channel"

      # rust-analyzer 컴포넌트가 필요합니다. tests/lsp_rust_analyzer.rs 의 스킵
      # 가드는 PATH 에서 `rust-analyzer` **파일 존재**만 보는데, rustup 은 항상
      # 같은 이름의 shim 을 깔아 둡니다 — 가드는 통과하고 실행 시 "Unknown binary
      # 'rust-analyzer' in official toolchain" 으로 죽습니다. 픽스처가 의존성 없는
      # 최소 크레이트라 컴포넌트만 있으면 몇 초에 진짜로 돕니다(스킵보다 낫습니다).
      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rust-analyzer, rustfmt, clippy

      # 2026-08-30 에 `cargo fmt` 를 한 번 전체 적용했다(143 파일). 그 뒤로는 손으로
      # 맞춘 들여쓰기가 다시 어긋나지 않게 여기서 막는다 — 가장 싼 게이트라 캐시
      # 복원 전에 먼저 돈다.
      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: src-tauri

      # cache-on-failure: 붉은 실행도 캐시를 남깁니다. 기본값(false)이면 테스트가
      # 깨진 실행은 캐시를 안 남겨, 고치고 다시 밀 때도 콜드 빌드를 또 합니다
      # (실측: 첫 실행 실패 → 두 번째도 콜드 10분31초).
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      # 프런트 산출물(dist/)이 없어도 `cargo test` 는 빌드됩니다 — 번들 단계가
      # 아니라서 frontendDist 존재를 요구하지 않고, 사이드카 플레이스홀더는
      # build.rs 가 자가 생성합니다. node/pnpm 이 필요 없는 이유입니다.
      # 2026-08-30 에 경고 50건을 전부 처리하고 `-D warnings` 로 잠갔다 (인자 8개+
      # 커맨드와 LSP 콜백 타입만 lib.rs 상단에서 허용). 테스트 타깃까지 본다.
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri

      # `cargo test` 는 export_bindings_typescript 로 src/lib/bindings.ts 를
      # 재생성합니다. 커밋된 파일과 어긋난다면 백엔드 커맨드를 고치고 bindings
      # 재생성을 빠뜨린 것입니다 — 이 저장소 고유의 실수 경로라 게이트로 막습니다.
      - name: bindings.ts 신선도 확인
        run: |
          if ! git diff --exit-code src/lib/bindings.ts; then
            echo "::error file=src/lib/bindings.ts::bindings.ts 가 최신이 아닙니다. src-tauri 에서 'cargo test' 를 돌린 뒤 재생성된 src/lib/bindings.ts 를 함께 커밋하세요."
            exit 1
          fi

  # 의존성 게이트 (플랜 `v241-errors-first` #cargo-deny). 그동안 취약점·라이선스·
  # 출처를 보는 잡이 **하나도 없었다** — Rust 의존성이 817 크레이트인데.
  #
  # 위 두 잡과 병렬로 돈다. Rust 툴체인도 pnpm 도 필요 없다: cargo-deny 는
  # `Cargo.lock` 만 읽고, 액션이 미리 컴파일된 바이너리를 받아 온다. ubuntu 에서
  # 1분 안팎.
  deps:
    name: 의존성 — cargo-deny (취약점 · 라이선스 · 출처)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # 설정은 저장소 루트의 `deny.toml` 이지만 매니페스트는 `src-tauri/` 에 있다.
      # cargo-deny 는 설정을 **매니페스트 옆**에서 찾으므로 명시적으로 넘긴다.
      #
      # ⚠ 경로는 **상대**여야 한다. 이 액션은 도커 컨테이너에서 돌고 워크스페이스를
      # `/github/workspace` 에 마운트하는데, `${{ github.workspace }}` 는 러너 쪽
      # 경로(`/home/runner/work/...`)라 컨테이너 안에 없다. 절대경로를 넘기면
      # 설정이 조용히 안 실리고 **기본값으로 돈다** — 첫 시도에서 그래서
      # `error[rejected]` 790건(라이선스 전부 거절)·`error[unmaintained]` 18건이
      # 났다. 워크디렉터리가 `/github/workspace` 라 상대경로가 맞게 풀린다.
      #
      # 넷 다 차단이다. 라이선스가 한동안 비차단이었던 이유는 허용 목록이 아니라
      # 루트 크레이트였다 — `src-tauri/Cargo.toml` 에 `license` 가 없어 cargo-deny
      # 가 `ocul-pm` 자신을 "unlicensed" 로 봤다(루트 LICENSE 는 다른 디렉터리라
      # 안 읽힌다). 그 한 줄을 넣어 해소했으므로 여기서 나눌 이유가 없다.
      #
      # 2026-09-04 첫 실행 실적: 공지 4건 적발 → 셋은 `cargo update` 로 닫고
      # (crossbeam-epoch, h2), 둘은 우리가 못 올리는 것이라 해제 조건과 함께
      # `deny.toml` 의 ignore 로. 로컬 재현: `cargo-deny --manifest-path
      # src-tauri/Cargo.toml --config deny.toml check`
      - name: cargo-deny — 취약점 · 금지 · 출처 · 라이선스
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans sources licenses
          arguments: --config deny.toml
