name: Release

# Benchmarked from the uvws/PySpace release pipeline. Pushing a `v*` tag builds
# signed bundles for macOS (Apple Silicon + Intel) and Windows, generates the
# updater artifacts (.sig + latest.json), and publishes a GitHub Release.
# The in-app updater then pulls `latest.json` from releases/latest/download.
#
# Required repo secrets:
#   TAURI_PRIVATE_KEY  — contents of src-tauri/updater.key (the minisign private
#                        key). Set it once: gh secret set TAURI_PRIVATE_KEY < src-tauri/updater.key
#   (The key was generated with an empty password, so no password secret is needed.)
#
#   Apple Developer ID signing + notarization (docs/RELEASE.md 7장):
#   APPLE_CERTIFICATE           — base64 of the exported Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  — the password used when exporting that .p12
#   APPLE_SIGNING_IDENTITY      — "Developer ID Application: <Name> (<TEAM_ID>)"
#   APPLE_ID                    — Apple ID e-mail of the developer account
#   APPLE_PASSWORD              — app-specific password from appleid.apple.com (NOT the
#                                 account password)
#   APPLE_TEAM_ID               — the 10-char team id
#   With any of these missing the bundler silently falls back to an *unsigned* bundle
#   instead of failing, so verify with `codesign -dvv` / `spctl -a -vvv` after release.
#
# NOTE: the in-app updater + the landing download links require this repo's
# *releases* to be public.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          # macOS Intel(x86_64) · Windows 는 추후 지원 예정.
          # Intel 은 ort/ONNX Runtime 이 x86_64-apple-darwin prebuilt 바이너리를
          # 제공하지 않아(소스 빌드 필요) 보류. 추가할 땐 아래 항목을 되살리세요:
          #   - platform: windows-latest
          #     args: ''
          #     rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          ver="${{ github.ref_name }}"
          body="$(awk -v t="## ${ver}" '$0==t{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)"
          {
            echo "body<<__CHANGELOG_EOF__"
            echo "$body"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # Developer ID signing — the CLI imports the .p12 into a temporary keychain
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization — xcrun notarytool + stapler run right after signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ocul-PM ${{ github.ref_name }}'
          releaseBody: |
            ## Ocul-PM ${{ github.ref_name }}

            ### ✨ What's new
            ${{ steps.notes.outputs.body }}

            ### Downloads
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `.dmg` (aarch64) |

            > macOS Intel · Windows 는 추후 업데이트 예정입니다.

            ### macOS 설치
            Apple Developer ID 서명 + 공증(notarization)을 마친 빌드입니다 — `.dmg` 를 열고
            `Applications` 로 끌어다 놓으면 끝입니다. `xattr` 같은 우회는 더 이상 필요 없습니다.

            이후 버전부터는 앱 안에서 **자동 업데이트**됩니다.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # VS Code 확장 .vsix 를 같은 릴리스에 첨부 (플랜 vscode-extension-round
      # {#rel-ci-vsix}) — 마켓이 막힌 환경의 오프라인 설치용:
      #   code --install-extension ocul-pm-<ver>.vsix
      # 마켓 게시 자체는 extension-release.yml(태그 ext-v*)이 한다. 확장 버전은
      # 앱 버전과 별개라 파일명은 확장 package.json 의 것을 쓴다.
      - name: Package VS Code extension
        run: |
          pnpm install --frozen-lockfile
          pnpm package
          ver="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce@3 package --no-dependencies -o "ocul-pm-${ver}.vsix"
        working-directory: extension

      - name: Attach .vsix to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" extension/ocul-pm-*.vsix --clobber
